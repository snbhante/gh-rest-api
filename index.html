<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub File-based Dynamic Database System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>👶 নবজাতকের নাম ও অর্থ (GitHub File DB)</h2>

    <!-- Config Card -->
    <div class="card">
      <h3>🔑 GitHub Configuration</h3>
      <div class="form-row">
        <input type="password" id="token" placeholder="Personal Access Token (PAT)">
        <input type="text" id="owner" placeholder="GitHub Username">
        <input type="text" id="repo" placeholder="Repository Name">
      </div>
      <button onclick="loadAllData()" class="btn btn-blue">ডেটা রিফ্রেশ/লোড করুন</button>
    </div>

    <!-- Data Entry Form -->
    <div class="card">
      <h3>➕ নতুন নাম যোগ করুন / এডিট করুন</h3>
      <form id="nameForm" onsubmit="handleSave(event)">
        <input type="hidden" id="editIndex">
        <input type="hidden" id="editFile">
        
        <div class="form-row">
          <input type="text" id="babyName" placeholder="নাম" required>
          <input type="text" id="babyMeaning" placeholder="অর্থ" required>
          <select id="babyCategory">
            <option value="বাংলা">বাংলা</option>
            <option value="ইংরেজি">ইংরেজি</option>
            <option value="চাকমা">চাকমা</option>
            <option value="পালি">পালি</option>
          </select>
        </div>

        <div class="form-row">
          <select id="babyStatus">
            <option value="">স্ট্যাটাস নির্বাচন করুন</option>
            <option value="selected">ধূসর টিক (পছন্দ করা হয়েছে)</option>
            <option value="kept">সবুজ টিক (রেখে দেওয়া হয়েছে)</option>
          </select>
          <button type="submit" id="saveBtn" class="btn btn-green">সংরক্ষণ করুন</button>
        </div>
      </form>
    </div>

    <!-- Data Display Table -->
    <div class="card">
      <h3>📋 সংরক্ষিত নামের তালিকা (All Files Combined)</h3>
      <table>
        <thead>
          <tr>
            <th>অবস্থা</th>
            <th>নাম</th>
            <th>অর্থ</th>
            <th>ক্যাটাগরি</th>
            <th>ফাইল উৎস</th>
            <th>অ্যাকশন</th>
          </tr>
        </thead>
        <tbody id="dataTable">
          <tr><td colspan="6" style="text-align:center;">কনফিগারেশন দিয়ে "লোড করুন" বাটনে ক্লিক করুন।</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Console Output -->
    <div class="card">
      <h3>📊 সিস্টেম লগ</h3>
      <pre id="logOutput">অপেক্ষমান...</pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
